<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Зрада Прибор</title>
    <meta name="description" content="Перемога, Зрада или Полная Задница — онлайн-прибор.">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" id="themeColorMeta" content="#07090e">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22><rect width=%2264%22 height=%2264%22 rx=%2218%22 fill=%22%230b101b%22/><path d=%22M12 42 A20 20 0 0 1 52 42%22 fill=%22none%22 stroke=%22%2338bdf8%22 stroke-width=%224%22 stroke-linecap=%22round%22/><path d=%22M32 42 L43 22%22 stroke=%22%23ff453a%22 stroke-width=%224%22 stroke-linecap=%22round%22/><circle cx=%2232%22 cy=%2242%22 r=%224%22 fill=%22%23ffffff%22/></svg>">
    <script>
        (function () {
            try {
                var saved = localStorage.getItem("zrada-glass-theme");
                if (saved === "light" || saved === "dark") {
                    document.documentElement.setAttribute("data-theme", saved);
                } else if (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches) {
                    document.documentElement.setAttribute("data-theme", "light");
                }
            } catch (_) {}
        })();
    </script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Фоновая сцена для преломления сквозь стекло -->
    <div class="scene" aria-hidden="true">
        <div class="scene-wave scene-wave--a"></div>
        <div class="scene-wave scene-wave--b"></div>
        <div class="scene-wave scene-wave--c"></div>
        <div class="scene-verdict-wash"></div>
    </div>

    <!-- Верхняя панель -->
    <header class="topbar">
        <div class="seg-control glass glass--pill" id="themeSeg" role="group" aria-label="Выбор темы">
            <div class="seg-thumb" aria-hidden="true"></div>

            <button class="seg-btn" type="button" data-theme="light" data-idx="0" aria-pressed="false">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="12" cy="12" r="4"/>
                    <path d="M12 2.5v2M12 19.5v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2.5 12h2M19.5 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
                </svg>
                <span>Яркая</span>
            </button>

            <button class="seg-btn" type="button" data-theme="dark" data-idx="1" aria-pressed="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M20.35 15.35A9 9 0 0 1 8.65 3.65 9 9 0 1 0 20.35 15.35Z"/>
                </svg>
                <span>Тёмная</span>
            </button>
        </div>

        <button class="sound-btn glass glass--pill active" type="button" id="soundBtn" aria-label="Переключить звук" aria-pressed="true">
            <svg class="sound-icon" id="soundIconOn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M11 5 6 9H3v6h3l5 4V5Z"/>
                <path d="M15.5 8.5a5 5 0 0 1 0 7"/>
                <path d="M18.5 5.5a9 9 0 0 1 0 13"/>
            </svg>
            <svg class="sound-icon" id="soundIconOff" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none" aria-hidden="true">
                <path d="M11 5 6 9H3v6h3l5 4V5Z"/>
                <path d="m21 9-6 6M15 9l6 6"/>
            </svg>
            <span>Звук</span>
        </button>
    </header>

    <!-- Корпус прибора -->
    <main class="stage">
        <section class="instrument glass" id="instrument">
            <div class="inst-header">
                <h1 class="inst-title">ЗРАДА ПРИБОР</h1>
                <div class="status-led" id="led" aria-hidden="true"></div>
            </div>

            <div class="dial-chamber">
                <svg class="dial-svg" viewBox="0 0 360 200" aria-hidden="true">
                    <defs>
                        <radialGradient id="hubGrad" cx="35%" cy="30%" r="68%">
                            <stop offset="0%" stop-color="#ffffff"/>
                            <stop offset="55%" stop-color="var(--hub-outer)"/>
                            <stop offset="100%" stop-color="var(--hub-inner)"/>
                        </radialGradient>
                        <filter id="needleShadow" x="-30%" y="-20%" width="160%" height="150%">
                            <feDropShadow dx="0" dy="2.5" stdDeviation="2.2" flood-color="#000000" flood-opacity="0.38"/>
                        </filter>

                        <path id="tp-peremoga" fill="none"/>
                        <path id="tp-zrada" fill="none"/>
                        <path id="tp-zadnitsa" fill="none"/>
                    </defs>

                    <!-- Внешняя и внутренняя дуги -->
                    <path id="outerArc" fill="none" stroke="var(--dial-ring)" stroke-width="1.2"/>
                    <path id="innerArc" fill="none" stroke="var(--dial-ring)" stroke-width="1"/>

                    <!-- Цветные сектора -->
                    <path id="sector-peremoga" class="dial-sector" style="color: var(--zone-peremoga)" fill="var(--zone-peremoga)"/>
                    <path id="sector-zrada" class="dial-sector" style="color: var(--zone-zrada)" fill="var(--zone-zrada)"/>
                    <path id="sector-zadnitsa" class="dial-sector" style="color: var(--zone-zadnitsa)" fill="var(--zone-zadnitsa)"/>

                    <!-- Разделители и деления -->
                    <g id="sectorDividers" stroke="var(--dial-ring)" stroke-width="1.2"></g>
                    <g id="dialTicks"></g>

                    <!-- Упоры шкалы -->
                    <circle cx="32" cy="178" r="2.2" fill="var(--dial-pin)" opacity="0.75"/>
                    <circle cx="328" cy="178" r="2.2" fill="var(--dial-pin)" opacity="0.75"/>

                    <!-- Названия зон -->
                    <text class="dial-label" id="lbl-peremoga">
                        <textPath href="#tp-peremoga" startOffset="50%" text-anchor="middle" dominant-baseline="central">ПЕРЕМОГА</textPath>
                    </text>
                    <text class="dial-label" id="lbl-zrada">
                        <textPath href="#tp-zrada" startOffset="50%" text-anchor="middle" dominant-baseline="central">ЗРАДА</textPath>
                    </text>
                    <text class="dial-label" id="lbl-zadnitsa">
                        <textPath href="#tp-zadnitsa" startOffset="50%" text-anchor="middle" dominant-baseline="central">ЗАДНИЦА</textPath>
                    </text>

                    <!-- Стрелка с противовесом и фасками -->
                    <g id="needleGroup" filter="url(#needleShadow)">
                        <polygon points="177.8,194 180,194 180,35 179.3,35" fill="var(--needle-light)"/>
                        <polygon points="180,194 182.2,194 180.7,35 180,35" fill="var(--needle-dark)"/>
                        <polygon points="179.5,56 180.5,56 180.7,35 179.3,35" fill="var(--needle-tip)"/>
                    </g>

                    <!-- Ось стрелки -->
                    <circle cx="180" cy="178" r="13" fill="rgba(0, 0, 0, 0.22)"/>
                    <circle cx="180" cy="178" r="11" fill="url(#hubGrad)"/>
                    <circle cx="180" cy="178" r="4.2" fill="var(--hub-inner)"/>
                    <circle cx="178.7" cy="176.7" r="1.3" fill="rgba(255, 255, 255, 0.85)"/>
                </svg>
                <div class="dial-dome"></div>
            </div>

            <div class="verdict-box" aria-live="polite">
                <div class="verdict-text" id="verdictText">Готов к работе</div>
            </div>

            <button class="action-btn" type="button" id="scanBtn">
                <span class="btn-spinner" aria-hidden="true"></span>
                <span id="scanBtnLabel">Замерить</span>
            </button>
        </section>
    </main>

    <!-- Подвал -->
    <footer class="footer">
        <a href="https://t.me/littleguyNEW" target="_blank" rel="noopener noreferrer" class="tg-pill glass glass--pill">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M21.93 4.19a1.25 1.25 0 0 0-1.35-.2L2.64 11.17a1.15 1.15 0 0 0 .06 2.15l4.48 1.56 1.72 5.38a1.05 1.05 0 0 0 1.78.4l2.54-2.66 4.44 3.31a1.25 1.25 0 0 0 1.97-.74l2.76-15.13a1.25 1.25 0 0 0-.46-1.25ZM8.9 14.37l9.28-6.17c.17-.11.34.12.2.26l-7.59 7.21-.3 3.24-1.59-4.54Z"/>
            </svg>
            <span>Telegram</span>
        </a>
    </footer>

    <script src="app.js" defer></script>
</body>
</html>
