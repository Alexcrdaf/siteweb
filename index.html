<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Зрада Прибор PRO | Версия 2.0</title>
    <meta name="description" content="Ультимативный анализатор реальности. Перемога или Зрада?">
    
    <style>
        :root {
            --bg-dark: #1a1a1a;
            --panel-dark: #2c2c2e;
            --text-main: #ffffff;
            --accent-gold: #ffd700;
            --peremoga-color: #34c759;
            --zrada-color: #ff3b30;
            --zadnitsa-color: #af52de;
            --button-blue: #007aff;
            --border-ui: #48484a;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, system-ui, BlinkMacSystemFont, "Segoe UI", Roboto, Ubuntu;
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            user-select: none;
        }

        /* Шапка */
        .app-header {
            width: 100%;
            padding: 20px;
            text-align: center;
            background: linear-gradient(180deg, rgba(0,0,0,0.5) 0%, transparent 100%);
        }

        .version-badge {
            font-size: 10px;
            background: var(--accent-gold);
            color: #000;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
            vertical-align: middle;
        }

        /* Основной контейнер прибора */
        .main-layout {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            padding: 20px;
            width: 100%;
            max-width: 500px;
            flex-grow: 1;
        }

        .device-case {
            background-color: var(--panel-dark);
            width: 100%;
            border-radius: 50px;
            border: 10px solid var(--border-ui);
            padding: 30px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8), inset 0 0 20px rgba(255,255,255,0.05);
            position: relative;
            transition: transform 0.1s;
        }

        .screen-glass {
            background: #111;
            border-radius: 20px;
            padding: 15px;
            margin-bottom: 20px;
            border: 2px solid #000;
            box-shadow: inset 0 0 10px #000;
        }

        /* Индикатор LED */
        .led-indicator {
            width: 15px;
            height: 15px;
            border-radius: 50%;
            background: #333;
            position: absolute;
            top: 25px;
            right: 40px;
            box-shadow: 0 0 5px rgba(0,0,0,0.5);
        }
        .led-active { background: #ff0000; box-shadow: 0 0 15px #ff0000; animation: blink 0.2s infinite; }

        @keyframes blink { from { opacity: 0.3; } to { opacity: 1; } }

        /* Циферблат */
        .gauge-container {
            position: relative;
            width: 100%;
            height: 160px;
            margin-top: 10px;
        }

        .gauge-svg {
            width: 100%;
            height: 100%;
        }

        .needle {
            position: absolute;
            bottom: 10px;
            left: 50%;
            width: 4px;
            height: 130px;
            background: #e74c3c;
            transform-origin: bottom center;
            transform: translateX(-50%) rotate(-90deg);
            transition: transform 0.1s cubic-bezier(0.17, 0.67, 0.83, 0.67);
            z-index: 5;
            border-radius: 4px;
        }

        .needle-pivot {
            position: absolute;
            bottom: 0;
            left: 50%;
            width: 20px;
            height: 20px;
            background: #95a5a6;
            border-radius: 50%;
            transform: translate(-50%, 50%);
            z-index: 6;
            border: 3px solid #333;
        }

        /* Сектора */
        .labels {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
            font-size: 12px;
            font-weight: bold;
            color: #888;
        }

        /* Кнопки управления */
        .ui-controls {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 15px;
            width: 100%;
        }

        .btn {
            border: none;
            border-radius: 15px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            color: white;
            text-transform: uppercase;
        }

        .btn-sound { background: var(--button-blue); height: 60px; }
        .btn-main { background: var(--accent-gold); color: #000; height: 60px; font-size: 18px; box-shadow: 0 5px 0 #b7950b; }
        .btn-main:active { transform: translateY(4px); box-shadow: none; }

        /* Секция истории */
        .history-panel {
            width: 100%;
            background: var(--panel-dark);
            border-radius: 20px;
            padding: 15px;
            margin-top: 20px;
            border: 1px solid var(--border-ui);
        }

        .history-title {
            font-size: 14px;
            color: #888;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
        }

        .history-list {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 150px;
            overflow-y: auto;
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #3d3d3f;
            font-size: 13px;
        }

        /* Статистика / Звание */
        .stats-bar {
            width: 100%;
            display: flex;
            justify-content: space-around;
            padding: 15px;
            background: rgba(255,255,255,0.05);
            border-radius: 15px;
            margin-top: 10px;
        }

        .stat-box { text-align: center; }
        .stat-val { display: block; font-size: 18px; font-weight: bold; color: var(--accent-gold); }
        .stat-label { font-size: 10px; color: #888; text-transform: uppercase; }

        /* Анимация частиц */
        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1000;
        }

        /* Модалка настроек */
        .settings-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.9);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            padding: 30px;
        }
    </style>
</head>
<body>

    <canvas id="confetti-canvas"></canvas>

    <header class="app-header">
        <h1>ЗРАДА ПРИБОР <span class="version-badge">PRO v2.4</span></h1>
    </header>

    <div class="main-layout">
        
        <div class="stats-bar">
            <div class="stat-box">
                <span class="stat-val" id="total-scans">0</span>
                <span class="stat-label">Сканов</span>
            </div>
            <div class="stat-box">
                <span class="stat-val" id="user-rank">Новичок</span>
                <span class="stat-label">Звание</span>
            </div>
            <div class="stat-box">
                <span class="stat-val" id="luck-index">50%</span>
                <span class="stat-label">Удача</span>
            </div>
        </div>

        <div class="device-case" id="device-body">
            <div class="led-indicator" id="status-led"></div>
            
            <div class="screen-glass">
                <div id="display-text" style="text-align: center; font-family: monospace; color: #0f0; font-size: 14px; min-height: 40px;">
                    СИСТЕМА ГОТОВА...<br>ОЖИДАНИЕ ВВОДА
                </div>

                <div class="gauge-container">
                    <svg class="gauge-svg" viewBox="0 0 200 120">
                        <path d="M20,110 A80,80 0 0,1 180,110" fill="none" stroke="#333" stroke-width="20" />
                        <path d="M20,110 A80,80 0 0,1 73,40" fill="none" stroke="#34c759" stroke-width="20" />
                        <path d="M73,40 A80,80 0 0,1 127,40" fill="none" stroke="#ff3b30" stroke-width="20" />
                        <path d="M127,40 A80,80 0 0,1 180,110" fill="none" stroke="#af52de" stroke-width="20" />
                    </svg>
                    <div class="needle" id="gauge-needle"></div>
                    <div class="needle-pivot"></div>
                </div>
                
                <div class="labels">
                    <span>ПЕРЕМОГА</span>
                    <span>ЗРАДА</span>
                    <span>ЗАДНИЦА</span>
                </div>
            </div>

            <div class="ui-controls">
                <button class="btn btn-sound" id="toggle-sound">🔇</button>
                <button class="btn btn-main" id="start-analysis">АНАЛИЗИРОВАТЬ</button>
            </div>
        </div>

        <div class="history-panel">
            <div class="history-title">
                <span>ПОСЛЕДНИЕ СОБЫТИЯ</span>
                <span id="clear-history" style="cursor:pointer; color: var(--button-blue);">Очистить</span>
            </div>
            <ul class="history-list" id="history-log">
                </ul>
        </div>

    </div>

    <script>
        /**
         * КЛАСС AUDIO MANAGER
         * Решает проблемы со звуком на iOS и Android
         */
        class AudioManager {
            constructor() {
                this.ctx = null;
                this.isEnabled = false;
                this.oscillator = null;
            }

            init() {
                if (this.ctx) return;
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                this.ctx = new AudioContext();
                
                // Разморозка для Safari
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            playTick() {
                if (!this.isEnabled || !this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(150 + Math.random() * 50, this.ctx.currentTime);
                gain.gain.setValueAtTime(0.05, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.05);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.05);
            }

            playResultSound(type) {
                if (!this.isEnabled || !this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.connect(gain);
                gain.connect(this.ctx.destination);

                if (type === 'peremoga') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(440, now);
                    osc.frequency.exponentialRampToValueAtTime(880, now + 0.5);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.linearRampToValueAtTime(0, now + 0.5);
                } else if (type === 'zrada') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(300, now);
                    osc.frequency.linearRampToValueAtTime(100, now + 0.5);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.linearRampToValueAtTime(0, now + 0.5);
                } else {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(100, now);
                    osc.frequency.linearRampToValueAtTime(50, now + 0.8);
                    gain.gain.setValueAtTime(0.4, now);
                    gain.gain.linearRampToValueAtTime(0, now + 0.8);
                }

                osc.start();
                osc.stop(now + 1);
            }
        }

        /**
         * ЭФФЕКТЫ ЧАСТИЦ
         */
        const canvas = document.getElementById('confetti-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function createConfetti() {
            for (let i = 0; i < 100; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: canvas.height + 10,
                    size: Math.random() * 8 + 4,
                    color: `hsl(${Math.random() * 360}, 70%, 50%)`,
                    speedY: -Math.random() * 10 - 5,
                    speedX: Math.random() * 6 - 3,
                    rotation: Math.random() * 360
                });
            }
        }

        function updateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach((p, i) => {
                p.y += p.speedY;
                p.x += p.speedX;
                p.speedY += 0.2; // гравитация
                p.rotation += 5;
                
                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate(p.rotation * Math.PI / 180);
                ctx.fillStyle = p.color;
                ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size);
                ctx.restore();

                if (p.y > canvas.height + 20) particles.splice(i, 1);
            });
            requestAnimationFrame(updateParticles);
        }
        updateParticles();

        /**
         * ГЛАВНЫЙ КОНТРОЛЛЕР ПРИЛОЖЕНИЯ
         */
        const audio = new AudioManager();
        const state = {
            isScanning: false,
            scansCount: parseInt(localStorage.getItem('scansCount')) || 0,
            history: JSON.parse(localStorage.getItem('scansHistory')) || []
        };

        const elements = {
            needle: document.getElementById('gauge-needle'),
            display: document.getElementById('display-text'),
            startBtn: document.getElementById('start-analysis'),
            soundBtn: document.getElementById('toggle-sound'),
            led: document.getElementById('status-led'),
            scanText: document.getElementById('total-scans'),
            rankText: document.getElementById('user-rank'),
            luckText: document.getElementById('luck-index'),
            historyList: document.getElementById('history-log'),
            device: document.getElementById('device-body')
        };

        // Обновить UI при загрузке
        function updateStatsUI() {
            elements.scanText.innerText = state.scansCount;
            
            let rank = "Новичок";
            if (state.scansCount > 10) rank = "Бывалый";
            if (state.scansCount > 50) rank = "Магистр Зрады";
            if (state.scansCount > 100) rank = "Пророк Перемоги";
            elements.rankText.innerText = rank;

            // Расчет индекса удачи (просто фейк-формула)
            const luck = Math.floor(Math.random() * 40 + 30);
            elements.luckText.innerText = luck + "%";
        }

        function addToHistory(result, color) {
            const now = new Date();
            const time = now.getHours() + ":" + String(now.getMinutes()).padStart(2, '0');
            const item = { result, color, time };
            
            state.history.unshift(item);
            if (state.history.length > 10) state.history.pop();
            
            localStorage.setItem('scansHistory', JSON.stringify(state.history));
            renderHistory();
        }

        function renderHistory() {
            elements.historyList.innerHTML = state.history.map(item => `
                <li class="history-item">
                    <span style="color: ${item.color}">${item.result}</span>
                    <span style="color: #555">${item.time}</span>
                </li>
            `).join('');
        }

        // Логика звука
        elements.soundBtn.addEventListener('click', (e) => {
            audio.init(); // Критично для iOS
            audio.isEnabled = !audio.isEnabled;
            elements.soundBtn.innerText = audio.isEnabled ? "🔊" : "🔇";
            elements.soundBtn.style.background = audio.isEnabled ? "var(--peremoga-color)" : "var(--button-blue)";
        });

        // Запуск анализа
        elements.startBtn.addEventListener('click', () => {
            if (state.isScanning) return;
            
            audio.init(); // Еще раз для уверенности на iOS
            state.isScanning = true;
            elements.startBtn.disabled = true;
            elements.led.classList.add('led-active');
            
            let progress = 0;
            const duration = 3000; // 3 секунды анализа
            const startTime = Date.now();

            const processScan = () => {
                const elapsed = Date.now() - startTime;
                progress = elapsed / duration;

                if (progress < 1) {
                    // Анимация стрелки (случайные колебания)
                    const jitter = Math.sin(Date.now() * 0.02) * 50;
                    const baseAngle = -90 + (progress * 180);
                    elements.needle.style.transform = `translateX(-50%) rotate(${baseAngle + jitter}deg)`;
                    
                    // Текстовые логи
                    const logs = ["ПОИСК СПУТНИКОВ...", "СКАНИРОВАНИЕ КАРМЫ...", "ЗАМЕР ТОКСИЧНОСТИ...", "ПРОВЕРКА В КОСМОЛОТО..."];
                    elements.display.innerHTML = `АНАЛИЗ: ${Math.floor(progress * 100)}%<br>${logs[Math.floor(progress * logs.length)]}`;
                    
                    // Тряска прибора
                    elements.device.style.transform = `translate(${Math.random()*4-2}px, ${Math.random()*4-2}px)`;

                    audio.playTick();
                    requestAnimationFrame(processScan);
                } else {
                    finalizeScan();
                }
            };

            requestAnimationFrame(processScan);
        });

        function finalizeScan() {
            state.isScanning = false;
            elements.startBtn.disabled = false;
            elements.led.classList.remove('led-active');
            elements.device.style.transform = "none";

            // Генерация результата
            const roll = Math.random() * 100;
            let finalAngle, resultText, resultColor, soundType;

            if (roll < 33) {
                finalAngle = -60 + (Math.random() * 30);
                resultText = "ЧИСТАЯ ПЕРЕМОГА! 🚀";
                resultColor = "var(--peremoga-color)";
                soundType = "peremoga";
                createConfetti();
            } else if (roll < 66) {
                finalAngle = -15 + (Math.random() * 30);
                resultText = "НУ, ЭТО ЗРАДА... 📉";
                resultColor = "var(--zrada-color)";
                soundType = "zrada";
            } else {
                finalAngle = 45 + (Math.random() * 40);
                resultText = "ПОЛНАЯ ЗАДНИЦА 🍑";
                resultColor = "var(--zadnitsa-color)";
                soundType = "zadnitsa";
            }

            // Установка стрелки
            elements.needle.style.transition = "transform 1.5s cubic-bezier(0.25, 1, 0.5, 1)";
            elements.needle.style.transform = `translateX(-50%) rotate(${finalAngle}deg)`;

            // Вывод текста
            elements.display.innerHTML = `<span style="color:${resultColor}; font-size: 18px; font-weight:bold">${resultText}</span>`;
            
            // Звук
            audio.playResultSound(soundType);

            // Сохранение
            state.scansCount++;
            localStorage.setItem('scansCount', state.scansCount);
            addToHistory(resultText, resultColor);
            updateStatsUI();

            // Сброс анимации стрелки через время
            setTimeout(() => {
                elements.needle.style.transition = "transform 0.1s";
            }, 1500);
        }

        // Очистка истории
        document.getElementById('clear-history').addEventListener('click', () => {
            state.history = [];
            localStorage.removeItem('scansHistory');
            renderHistory();
        });

        // Инициализация
        updateStatsUI();
        renderHistory();

        // Поддержка касаний для iOS (снятие блокировки аудио)
        document.body.addEventListener('touchstart', () => {
            audio.init();
        }, { passive: true });

    </script>
</body>
</html>
