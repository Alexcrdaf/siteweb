<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f172a">

<title>Зрада Прибор</title>

<style>
:root{
    --bg: #0f172a;
    --glass: rgba(255,255,255,.08);
    --stroke: rgba(255,255,255,.18);
    --text: #f8fafc;
    --muted: #94a3b8;
    --green: #22c55e;
    --red: #ef4444;
    --orange: #f97316;
    --blue: #3b82f6;
}

*{box-sizing:border-box}

body{
    margin:0;
    min-height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
        radial-gradient(1200px 600px at 20% -10%, #1e293b, transparent),
        radial-gradient(800px 500px at 80% 110%, #020617, transparent),
        var(--bg);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;
    color:var(--text);
    user-select:none;
    -webkit-user-select:none;
    overflow:hidden;
}

.device{
    width:min(92%,380px);
    padding:22px 20px 26px;
    border-radius:28px;
    background:linear-gradient(
        180deg,
        rgba(255,255,255,.14),
        rgba(255,255,255,.04)
    );
    backdrop-filter: blur(22px) saturate(160%);
    -webkit-backdrop-filter: blur(22px) saturate(160%);
    border:1px solid var(--stroke);
    box-shadow:
        0 30px 60px rgba(0,0,0,.55),
        inset 0 1px 0 rgba(255,255,255,.25);
    position:relative;
}

.device.shaking{
    animation: shake 0.45s infinite;
}

@keyframes shake{
    0%{transform:translate(0,0)}
    25%{transform:translate(-2px,1px)}
    50%{transform:translate(2px,-1px)}
    75%{transform:translate(-1px,-2px)}
    100%{transform:translate(0,0)}
}

.header{
    text-align:center;
    margin-bottom:16px;
}

.header h1{
    margin:0;
    font-size:20px;
    letter-spacing:.14em;
    font-weight:700;
}

.subtitle{
    font-size:11px;
    color:var(--muted);
    margin-top:6px;
}

.led{
    position:absolute;
    top:16px;
    right:16px;
    width:12px;
    height:12px;
    border-radius:50%;
    background:#020617;
    box-shadow:inset 0 0 4px rgba(0,0,0,.8);
}

.led.active{
    background:var(--red);
    box-shadow:0 0 12px var(--red);
    animation:pulse .12s infinite alternate;
}

@keyframes pulse{
    from{opacity:.6}
    to{opacity:1}
}

/* Gauge */
.gauge-wrap{
    position:relative;
    width:100%;
    padding-bottom:52%;
}

.gauge{
    position:absolute;
    inset:0;
    border-radius:600px 600px 0 0;
    background:conic-gradient(
        from 270deg at 50% 100%,
        var(--green) 0deg 60deg,
        var(--red) 60deg 120deg,
        var(--orange) 120deg 180deg
    );
    border:1px solid rgba(255,255,255,.2);
    border-bottom:none;
    box-shadow:
        inset 0 10px 25px rgba(0,0,0,.45);
}

.label{
    position:absolute;
    font-size:11px;
    font-weight:600;
    text-shadow:0 2px 4px rgba(0,0,0,.7);
}

.label.left{left:16px;bottom:8px}
.label.center{left:50%;top:14px;transform:translateX(-50%)}
.label.right{right:16px;bottom:8px}

.emoji{display:block;font-size:16px;margin-bottom:2px}

/* Needle */
.needle{
    position:absolute;
    bottom:0;
    left:50%;
    width:3px;
    height:88%;
    background:linear-gradient(
        to top,
        #e5e7eb,
        #ffffff
    );
    transform-origin:bottom;
    transform:rotate(0deg);
    border-radius:3px;
    box-shadow:0 6px 12px rgba(0,0,0,.5);
    transition:transform .9s cubic-bezier(.18,.89,.32,1.28);
    z-index:5;
}

.needle-center{
    position:absolute;
    bottom:-9px;
    left:50%;
    width:20px;
    height:20px;
    border-radius:50%;
    background:linear-gradient(180deg,#cbd5f5,#94a3b8);
    transform:translateX(-50%);
    border:1px solid rgba(0,0,0,.4);
    z-index:6;
}

/* Controls */
.controls{
    margin-top:22px;
    display:flex;
    gap:12px;
}

button{
    appearance:none;
    border:none;
    border-radius:16px;
    padding:16px;
    font-size:16px;
    font-weight:700;
    color:#020617;
    background:linear-gradient(180deg,#f8fafc,#cbd5f5);
    box-shadow:
        0 8px 20px rgba(0,0,0,.35),
        inset 0 1px 0 white;
    flex:1;
    transition:transform .08s,box-shadow .08s;
}

button:active{
    transform:scale(.96);
    box-shadow:0 4px 10px rgba(0,0,0,.45);
}

button:disabled{
    opacity:.55;
}

.sound{
    max-width:64px;
    background:linear-gradient(180deg,#60a5fa,#2563eb);
    color:white;
}

/* Result */
.result{
    margin-top:18px;
    min-height:1.4em;
    text-align:center;
    font-size:19px;
    font-weight:700;
    transition:color .4s, transform .4s;
}
</style>
</head>

<body>

<div class="device" id="device">
    <div class="led" id="led"></div>

    <div class="header">
        <h1>ЗРАДА ПРИБОР</h1>
        <div class="subtitle">iOS Edition 26</div>
    </div>

    <div class="gauge-wrap">
        <div class="gauge">
            <div class="label left"><span class="emoji">😎</span>ПЕРЕМОГА</div>
            <div class="label center"><span class="emoji">😱</span>ЗРАДА</div>
            <div class="label right"><span class="emoji">🍑</span>ЗАДНИЦА</div>
            <div class="needle" id="needle"></div>
        </div>
        <div class="needle-center"></div>
    </div>

    <div class="controls">
        <button class="sound" id="soundBtn">🔇</button>
        <button id="scanBtn">СКАН</button>
    </div>

    <div class="result" id="result">Готов к анализу</div>
</div>

<script>
const needle=document.getElementById("needle");
const scanBtn=document.getElementById("scanBtn");
const result=document.getElementById("result");
const device=document.getElementById("device");
const led=document.getElementById("led");
const soundBtn=document.getElementById("soundBtn");

let sound=false;

soundBtn.onclick=()=>{
    sound=!sound;
    soundBtn.textContent=sound?"🔊":"🔇";
};

scanBtn.onclick=()=>{
    scanBtn.disabled=true;
    result.textContent="АНАЛИЗ…";
    result.style.color="#e5e7eb";
    device.classList.add("shaking");
    led.classList.add("active");

    let steps=0;
    const i=setInterval(()=>{
        needle.style.transform=`rotate(${Math.random()*180-90}deg)`;
        steps++;
        if(steps>24){
            clearInterval(i);
            finish();
        }
    },70);
};

function finish(){
    device.classList.remove("shaking");
    led.classList.remove("active");

    const a=Math.random()*180-90;
    needle.style.transform=`rotate(${a}deg)`;

    setTimeout(()=>{
        if(a<-30){
            result.textContent="ЕСТЬ ПЕРЕМОГА 😎";
            result.style.color="var(--green)";
        }else if(a<30){
            result.textContent="ЗРАДА 🤬";
            result.style.color="var(--red)";
        }else{
            result.textContent="ПОЛНАЯ ЗАДНИЦА 🍑";
            result.style.color="var(--orange)";
        }
        scanBtn.disabled=false;
    },700);
}
</script>

</body>
</html>
