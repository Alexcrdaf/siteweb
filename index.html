<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Зрада Прибор PRO+</title>
    <style>
        body {
            font-family: -apple-system, system-ui, sans-serif;
            background-color: #1a252f;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; height: 100dvh; margin: 0; color: white;
            user-select: none; -webkit-user-select: none; touch-action: none;
        }

        .device-container {
            background-color: #34495e; padding: 25px; border-radius: 30px;
            box-shadow: 0 15px 50px rgba(0,0,0,0.8);
            text-align: center; width: 85%; max-width: 380px;
            border: 4px solid #7f8c8d; position: relative;
        }

        h1 { margin: 0; font-size: 22px; text-transform: uppercase; letter-spacing: 2px; }

        /* Шкала с делениями */
        .gauge-wrapper {
            position: relative; width: 100%; height: 0; padding-bottom: 55%; margin: 30px auto;
        }

        .gauge {
            width: 100%; height: 100%; position: absolute;
            border-radius: 500px 500px 0 0;
            background: conic-gradient(
                from 270deg at 50% 100%,
                #2ecc71 0deg 60deg,
                #f1c40f 60deg 90deg,
                #e74c3c 90deg 140deg,
                #5d4037 140deg 180deg
            );
            border: 3px solid #2c3e50; border-bottom: none;
        }

        /* Текстовые метки на шкале */
        .scale-label {
            position: absolute; font-size: 10px; font-weight: bold; text-shadow: 1px 1px 2px black;
        }
        .l-peremoga { bottom: 10px; left: 10px; }
        .l-zrada { top: 15px; left: 50%; transform: translateX(-50%); }
        .l-zad { bottom: 10px; right: 10px; }

        .needle {
            width: 4px; height: 95%; background: #e74c3c;
            position: absolute; bottom: 0; left: 50%; margin-left: -2px;
            transform-origin: bottom center; z-index: 10;
            border-radius: 4px; transition: transform 0.1s linear;
        }

        #result-text {
            height: 60px; margin-top: 15px; font-size: 20px; font-weight: 800;
            display: flex; align-items: center; justify-content: center;
        }

        .controls { display: flex; gap: 10px; margin-top: 10px; }
        button {
            border: none; border-radius: 15px; font-weight: bold;
            cursor: pointer; transition: all 0.1s; -webkit-tap-highlight-color: transparent;
        }
        #scanBtn {
            flex-grow: 1; padding: 18px; background: #f1c40f; color: #2c3e50; font-size: 18px;
            box-shadow: 0 4px 0 #b7950b;
        }
        .sound-btn { width: 60px; background: #3498db; color: white; font-size: 20px; }
        button:active { transform: translateY(4px); box-shadow: none; }

        .particle { position: fixed; pointer-events: none; border-radius: 50%; z-index: 100; }
    </style>
</head>
<body>

    <div class="device-container" id="device">
        <h1>ЗРАДА ПРИБОР PRO</h1>
        
        <div class="gauge-wrapper">
            <div class="gauge">
                <span class="scale-label l-peremoga">ПЕРЕМОГА</span>
                <span class="scale-label l-zrada">ЗРАДА</span>
                <span class="scale-label l-zad">ЗАДНИЦА</span>
                <div class="needle" id="needle"></div>
            </div>
            <div style="width:20px; height:20px; background:#bdc3c7; border-radius:50%; position:absolute; bottom:-10px; left:50%; transform:translateX(-50%); z-index:11; border:2px solid #2c3e50;"></div>
        </div>

        <div id="result-text">НАЖМИ СКАН</div>

        <div class="controls">
            <button class="sound-btn" id="soundBtn" onclick="toggleSound()">🔇</button>
            <button id="scanBtn" onclick="startAnalysis()">СКАН</button>
        </div>
    </div>

    <script>
        // СПИСКИ ФРАЗ ДЛЯ РЕЗУЛЬТАТОВ
        const phrases = {
            peremoga: ["ЧИСТАЯ ПЕРЕМОГА! 🦅", "МОЩНЫЙ ФЛЕКС! 😎", "ВСЁ ИДЁТ ПО ПЛАНУ ✅", "ГЕНИАЛЬНО! 🔥"],
            zrada: ["ЛЮТАЯ ЗРАДА! 😱", "ТИКАЙ С ГОРОДУ! 🏃‍♂️", "ЭТО ПОДСТАВА! 🧨", "НУ КАК ТАК-ТО? 🤬"],
            zadnitsa: ["ПОЛНАЯ ЗАДНИЦА 🍑", "ПРИЕХАЛИ... ⚓", "ГРОБ КЛАДБИЩЕ ⚰️", "ВЫХОДА НЕТ 🛑"],
            neutral: ["НУ ТАКОЕ... 😐", "50 на 50 ⚖️", "НИ РЫБА НИ МЯСО 🐟"]
        };

        const needle = document.getElementById('needle');
        const resultText = document.getElementById('result-text');
        const scanBtn = document.getElementById('scanBtn');
        let isSoundOn = false;
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function toggleSound() {
            initAudio();
            isSoundOn = !isSoundOn;
            document.getElementById('soundBtn').innerText = isSoundOn ? "🔊" : "🔇";
        }

        function playTone(f, d) {
            if (!isSoundOn || !audioCtx) return;
            const o = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            o.frequency.value = f;
            g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + d);
            o.connect(g); g.connect(audioCtx.destination);
            o.start(); o.stop(audioCtx.currentTime + d);
        }

        function startAnalysis() {
            initAudio();
            scanBtn.disabled = true;
            resultText.innerText = "АНАЛИЗИРУЮ...";
            
            let steps = 0;
            const interval = setInterval(() => {
                const rnd = Math.random() * 180 - 90;
                needle.style.transform = `rotate(${rnd}deg)`;
                playTone(200 + Math.random() * 500, 0.05);
                steps++;
                if (steps > 25) {
                    clearInterval(interval);
                    showFinalResult();
                }
            }, 80);
        }

        function showFinalResult() {
            const angle = Math.floor(Math.random() * 180) - 90;
            needle.style.transition = "transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275)";
            needle.style.transform = `rotate(${angle}deg)`;

            setTimeout(() => {
                let category, color;
                
                if (angle < -40) { category = 'peremoga'; color = '#2ecc71'; }
                else if (angle < 15) { category = 'neutral'; color = '#f1c40f'; }
                else if (angle < 60) { category = 'zrada'; color = '#e74c3c'; }
                else { category = 'zadnitsa'; color = '#d35400'; }

                const list = phrases[category];
                resultText.innerText = list[Math.floor(Math.random() * list.length)];
                resultText.style.color = color;
                
                playTone(angle < 0 ? 600 : 150, 0.5);
                scanBtn.disabled = false;
                needle.style.transition = "transform 0.1s linear";
            }, 800);
        }
    </script>
</body>
</html>
