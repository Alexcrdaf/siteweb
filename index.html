<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- SEO и Соцсети -->
    <title>Зрада Прибор | Онлайн Анализатор</title>
    <meta name="description" content="Узнай судьбу: Перемога, Зрада или Тотальная Задница? Мем-анализатор ситуации.">
    <meta property="og:title" content="Зрада Прибор Онлайн">
    <meta property="og:description" content="Генератор случайных прогнозов. Проверь свой уровень удачи прямо сейчас.">
    <meta property="og:type" content="website">
    
    <!-- Настройки для мобилок (iOS/Android) -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#2c3e50">
    
    <!-- Иконка сайта (генерируется из эмодзи) -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧭</text></svg>">

    <style>
        /* CSS STYLES */
        :root {
            --bg-color: #2c3e50;
            --panel-color: #34495e;
            --text-color: #ecf0f1;
            --accent-yellow: #f1c40f;
            --accent-dark-yellow: #b7950b;
            --peremoga: #2ecc71;
            --zrada: #e74c3c;
            --zadnitsa: #5d4037;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            height: 100dvh; 
            margin: 0;
            color: var(--text-color);
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden;
            touch-action: manipulation;
        }

        .device-container {
            background-color: var(--panel-color);
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            text-align: center;
            width: 90%; 
            max-width: 400px;
            border: 3px solid #7f8c8d;
            position: relative;
            transition: transform 0.1s;
            box-sizing: border-box;
        }

        .shaking { animation: shake 0.5s infinite; }

        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            20% { transform: translate(-2px, 0px) rotate(1deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            60% { transform: translate(-2px, 1px) rotate(0deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }

        h1 {
            margin: 5px 0;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 24px;
            text-shadow: 2px 2px 0px #000;
        }

        .subtitle {
            font-size: 11px;
            color: #bdc3c7;
            margin-bottom: 20px;
            text-transform: uppercase;
            opacity: 0.7;
            letter-spacing: 1px;
        }

        .gauge-wrapper {
            position: relative;
            width: 100%;
            height: 0;
            padding-bottom: 50%;
            margin: 0 auto;
            overflow: hidden;
        }

        .gauge {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            border-radius: 500px 500px 0 0;
            background: conic-gradient(
                from 270deg at 50% 100%, 
                var(--peremoga) 0deg 60deg,  
                var(--zrada) 60deg 120deg, 
                var(--zadnitsa) 120deg 180deg 
            );
            box-shadow: inset 0 0 15px rgba(0,0,0,0.5);
            border: 2px solid var(--bg-color);
            border-bottom: none;
            box-sizing: border-box;
        }

        .label {
            position: absolute;
            font-size: 12px;
            font-weight: bold;
            text-shadow: 1px 1px 2px black;
            z-index: 2;
            text-transform: uppercase;
        }
        @media (max-width: 360px) { .label { font-size: 10px; } }

        .label-peremoga { bottom: 10%; left: 5%; color: #fff; }
        .label-zrada { top: 15%; left: 50%; transform: translateX(-50%); color: #fff; }
        .label-zadnitsa { bottom: 10%; right: 5%; color: #fff; }

        .emoji { font-size: 18px; display: block; text-align: center; margin-bottom: 2px; }

        .needle {
            width: 4px;
            height: 90%;
            background-color: #ecf0f1;
            position: absolute;
            bottom: 0;
            left: 50%;
            margin-left: -2px;
            transform-origin: bottom center;
            transform: rotate(0deg); 
            z-index: 10;
            border-radius: 50% 50% 0 0;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.5);
            will-change: transform;
        }

        .needle-center {
            width: 20px;
            height: 20px;
            background-color: #95a5a6;
            border-radius: 50%;
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 11;
            box-shadow: 0 0 5px black;
            border: 2px solid #7f8c8d;
        }

        .controls {
            margin-top: 25px;
            display: flex;
            gap: 10px;
            justify-content: center;
            align-items: center;
        }

        button {
            background-color: var(--accent-yellow);
            border: none;
            padding: 16px;
            font-size: 16px;
            font-weight: bold;
            color: var(--bg-color);
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.1s;
            box-shadow: 0 4px 0 var(--accent-dark-yellow);
            -webkit-tap-highlight-color: transparent;
            outline: none;
        }

        button:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 var(--accent-dark-yellow);
        }

        button:disabled {
            background-color: #95a5a6;
            box-shadow: none;
            cursor: not-allowed;
            transform: translateY(4px);
            opacity: 0.7;
        }

        #scanBtn { flex-grow: 1; font-size: 18px; }

        .sound-btn {
            background-color: #3498db;
            box-shadow: 0 4px 0 #2980b9;
            color: white;
            width: 60px;
            font-size: 22px;
            padding: 14px 0;
        }
        .sound-btn:active { box-shadow: 0 0 0 #2980b9; }

        #result-text {
            margin-top: 20px;
            font-size: 22px;
            font-weight: bold;
            min-height: 1.5em;
            color: var(--text-color);
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
            line-height: 1.2;
        }

        .status-light {
            width: 12px;
            height: 12px;
            background-color: #222;
            border-radius: 50%;
            position: absolute;
            top: 20px;
            right: 20px;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.5);
            transition: background 0.3s;
        }
        .status-light.active {
            background-color: #e74c3c;
            box-shadow: 0 0 8px #e74c3c;
            animation: blink 0.15s infinite alternate;
        }

        @keyframes blink { from { opacity: 0.5; } to { opacity: 1; } }
    </style>
</head>
<body>

    <div class="device-container" id="device">
        <div class="status-light" id="led"></div>
        <h1>ЗРАДА ПРИБОР</h1>
        <div class="subtitle">Online Scanner v3.0</div>
        
        <div class="gauge-wrapper">
            <div class="gauge">
                <span class="label label-peremoga"><span class="emoji">😎</span>ПЕРЕМОГА</span>
                <span class="label label-zrada"><span class="emoji">😱</span>ЗРАДА</span>
                <span class="label label-zadnitsa"><span class="emoji">🍑</span>ЗАДНИЦА</span>
                
                <div class="needle" id="needle"></div>
            </div>
            <div class="needle-center"></div>
        </div>

        <div class="controls">
            <button class="sound-btn" id="soundBtn" aria-label="Звук" onclick="toggleSound()">🔇</button>
            <button id="scanBtn" onclick="startAnalysis()">ЗАПУСТИТЬ</button>
        </div>

        <div id="result-text">Готов к работе</div>
    </div>

    <script>
        // Предотвращаем скролл и зум на iOS
        document.addEventListener('gesturestart', function (e) { e.preventDefault(); });

        const needle = document.getElementById('needle');
        const resultText = document.getElementById('result-text');
        const scanBtn = document.getElementById('scanBtn');
        const device = document.getElementById('device');
        const led = document.getElementById('led');
        const soundBtn = document.getElementById('soundBtn');

        let isSoundOn = false;
        let audioCtx = null;

        // Unlock AudioContext for iOS Safari
        function unlockAudio() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            // Silent buffer to unlock
            const buffer = audioCtx.createBuffer(1, 1, 22050);
            const source = audioCtx.createBufferSource();
            source.buffer = buffer;
            source.connect(audioCtx.destination);
            source.start(0);
        }

        function toggleSound() {
            unlockAudio();
            isSoundOn = !isSoundOn;
            soundBtn.innerText = isSoundOn ? "🔊" : "🔇";
            soundBtn.style.backgroundColor = isSoundOn ? "#2ecc71" : "#3498db";
        }

        function playTone(type) {
            if (!isSoundOn || !audioCtx) return;

            const now = audioCtx.currentTime;
            
            if (type === 'tick') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.type = 'square';
                osc.frequency.setValueAtTime(150 + Math.random() * 50, now);
                gain.gain.setValueAtTime(0.05, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
                osc.start(now);
                osc.stop(now + 0.05);
            } 
            else if (type === 'peremoga') {
                const playNote = (f, d) => {
                    const o = audioCtx.createOscillator();
                    const g = audioCtx.createGain();
                    o.connect(g);
                    g.connect(audioCtx.destination);
                    o.type = 'triangle';
                    o.frequency.value = f;
                    g.gain.setValueAtTime(0.1, now + d);
                    g.gain.linearRampToValueAtTime(0, now + d + 0.3);
                    o.start(now + d);
                    o.stop(now + d + 0.3);
                };
                playNote(523.25, 0); // C
                playNote(659.25, 0.1); // E
                playNote(783.99, 0.2); // G
                playNote(1046.50, 0.4); // High C
            } 
            else if (type === 'zrada') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(600, now);
                osc.frequency.linearRampToValueAtTime(800, now + 0.2);
                osc.frequency.linearRampToValueAtTime(600, now + 0.4);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.linearRampToValueAtTime(0, now + 0.4);
                osc.start(now);
                osc.stop(now + 0.4);
            } 
            else if (type === 'zadnitsa') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(120, now);
                osc.frequency.exponentialRampToValueAtTime(40, now + 0.6);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.linearRampToValueAtTime(0, now + 0.6);
                osc.start(now);
                osc.stop(now + 0.6);
            }
        }

        function startAnalysis() {
            if (isSoundOn) unlockAudio();

            scanBtn.disabled = true;
            scanBtn.innerText = "⏳...";
            resultText.innerText = "АНАЛИЗ ДАННЫХ";
            resultText.style.color = "#ecf0f1";
            
            device.classList.add('shaking');
            led.classList.add('active');
            
            needle.style.transition = "none";

            let scanSteps = 0;
            const maxSteps = 30; // Чуть дольше для саспенса

            const interval = setInterval(() => {
                const randomAngle = Math.floor(Math.random() * 180) - 90;
                needle.style.transform = `rotate(${randomAngle}deg)`;
                
                if (scanSteps % 4 === 0) playTone('tick');
                if (navigator.vibrate) navigator.vibrate(5);

                scanSteps++;
                if (scanSteps >= maxSteps) finishAnalysis(interval);
            }, 70);
        }

        function finishAnalysis(interval) {
            clearInterval(interval);
            device.classList.remove('shaking');
            led.classList.remove('active');

            const finalAngle = Math.floor(Math.random() * 180) - 90;
            // Реалистичный отскок стрелки
            needle.style.transition = "transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1)"; 
            
            setTimeout(() => {
                needle.style.transform = `rotate(${finalAngle}deg)`;
                showResult(finalAngle);
            }, 50);
        }

        function showResult(angle) {
            setTimeout(() => {
                let text = "";
                let color = "";
                let soundType = "";

                if (angle <= -30) {
                    text = "ЕСТЬ ПЕРЕМОГА! 😎";
                    color = "#2ecc71";
                    soundType = "peremoga";
                } else if (angle > -30 && angle < 30) {
                    text = "УВЫ, ЗРАДА! 🤬";
                    color = "#e74c3c";
                    soundType = "zrada";
                } else {
                    text = "ПОЛНАЯ ЗАДНИЦА 🍑";
                    color = "#d35400";
                    soundType = "zadnitsa";
                }

                resultText.innerText = text;
                resultText.style.color = color;
                playTone(soundType);
                
                if (navigator.vibrate) navigator.vibrate([50, 50, 50]);

                scanBtn.disabled = false;
                scanBtn.innerText = "ЗАПУСТИТЬ";
            }, 600);
        }
    </script>
</body>
</html>
